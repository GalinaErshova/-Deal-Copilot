[project]
name = "deal-copilot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "openai>=1.60",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.ruff]
line-length = 100
